name: Build Prod Binary
on:
  workflow_call:
    inputs:
      platforms:
        type: string
        required: true
      static:
        type: string
        required: true
      version:
        type: string
        required: true

jobs:
  build:
    strategy:
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
        static: ${{ fromJSON(inputs.static) }}

    name: ${{ matrix.platform }}
    runs-on:
      # https://github.com/actions/runner-images?tab=readme-ov-file#available-images
      # https://github.blog/changelog/2025-01-16-linux-arm64-hosted-runners-now-available-for-free-in-public-repositories-public-preview/
      ${{
        (matrix.platform == 'linux-x86_64' && 'ubuntu-24.04') ||
        (matrix.platform == 'linux-arm64' && 'ubuntu-24.04-arm') ||
        (matrix.platform == 'darwin-x86_64' && 'macos-15-intel') ||
        (matrix.platform == 'darwin-arm64' && 'macos-15') ||
        null
      }}
    env:
      FOURMOLU_REV: ${{ github.sha }}
      version: ${{ inputs.version }}
      platform: ${{ matrix.platform }}
      static: ${{ matrix.static }}
      target: ${{ matrix.platform }}${{ matrix.static && '-static' || '' }}

    steps:
      -
        uses: actions/checkout@v7
      -
        name: Verify platform
        run: |
          set -x
          case ${{ runner.os }} in
            (Linux) os=linux ;;
            (macOS) os=darwin ;;
            (*) echo 'Unknown OS' >&1; exit 1 ;;
          esac
          case ${{ runner.arch }} in
            (X64) arch=x86_64 ;;
            (ARM64) arch=arm64 ;;
            (*) echo 'Unknown architecture' >&1; exit 1 ;;
          esac
          if [[ $os-$arch != ${platform} ]]; then
            echo "Incorrect platform: $os-$arch" >&2
            exit 1
          fi
      -
        uses: haskell-actions/setup@v2.11.0
        with:
          enable-stack: true
          stack-no-global: true
      -
        uses: actions/cache@v6
        with:
          path: ~/.stack
          key: ${{ env.target }}-build-prod-binary-${{ hashFiles('stack.yaml', 'fourmolu.cabal') }}
          restore-keys: |
               ${{ env.target }}-build-prod-binary-
      -
        name: Build
        run: |
          ARGS=(--local-bin-path ./bin/)

          if [[ ${{ matrix.static }} = true ]]; then
            ARGS+=(--ghc-options='-static -threaded -fPIC -optc-static -optl-static -optl-pthread -split-sections')
            {
              echo 'ghc-options:'
              echo '  "$everything": -fPIC'
            } >> stack.yaml
            if [[ ${{ runner.arch }} = ARM64 ]]; then
              # Default ld.gold linker has trouble with aarch64: unsupported TLSLE reloc
              ARGS+=(--ghc-options='-optl-fuse-ld=bfd')
            fi
          fi

          stack install "${ARGS[@]}" :fourmolu
          strip bin/fourmolu
          cp bin/fourmolu bin/fourmolu-${version}-${target}
      -
        name: Store binary
        uses: actions/upload-artifact@v7
        with:
          name: fourmolu-binary-${{ env.target }}
          path: bin/fourmolu-*
